name: Build Source Portable Python
run-name: ${{ inputs.signing_session != '' && format('Finalize signed {0}', inputs.signing_session) || github.workflow }}

on:
  workflow_dispatch:
    inputs:
      signed_release_id:
        description: 'Draft release ID for final signed-byte attestation only'
        required: false
        default: ''
        type: string
      signing_session:
        description: 'Locally authorized signing session ID'
        required: false
        default: ''
        type: string
      signing_manifest_sha256:
        description: 'SHA-256 of the locally signed release manifest'
        required: false
        default: ''
        type: string
      force_rebuild:
        description: "Force build even if latest release already has same versions."
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      major_filter:
        description: "Optional major to rebuild (example: 3.11)."
        required: false
        default: ""
        type: string
      target_os_filter:
        description: "Optional target OS filter."
        required: false
        default: "any"
        type: choice
        options:
          - any
          - linux
          - windows
          - macos
      target_arch_filter:
        description: "Optional target architecture filter."
        required: false
        default: "any"
        type: choice
        options:
          - any
          - x86_64
          - arm64
      release_tag:
        description: "Optional release tag (example: 2026.04.16). If set, create GitHub release."
        required: false
        type: string

permissions:
  contents: read

jobs:
  check-upstream:
    permissions:
      contents: write
    if: github.event.inputs.signed_release_id == ''
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.plan.outputs.should_build }}
      current_versions_json: ${{ steps.plan.outputs.current_versions_json }}
      changed_versions_json: ${{ steps.plan.outputs.changed_versions_json }}
      release_plan_json: ${{ steps.plan.outputs.release_plan_json }}
      release_tag: ${{ steps.plan.outputs.release_tag }}
      matrix: ${{ steps.make-matrix.outputs.matrix }}
      matrix_has_entries: ${{ steps.make-matrix.outputs.matrix_has_entries }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - id: resolve
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/resolve_latest_patch.py --majors-file config/majors.json --details > resolved-details.json
          cat resolved-details.json

      - name: Inspect recorded release inventory
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/release_inventory.py fetch --state-file release-state/latest.json --output release-inventory.json

      - id: plan
        env:
          FORCE_REBUILD: ${{ github.event.inputs.force_rebuild || 'false' }}
          RELEASE_TAG_INPUT: ${{ github.event.inputs.release_tag || '' }}
          MAJOR_FILTER_INPUT: ${{ github.event.inputs.major_filter || '' }}
          TARGET_OS_FILTER_INPUT: ${{ github.event.inputs.target_os_filter || 'any' }}
          TARGET_ARCH_FILTER_INPUT: ${{ github.event.inputs.target_arch_filter || 'any' }}
        run: |
          set -euo pipefail

          PLAN_ARGS=()
          FORCE_REBUILD_EFFECTIVE="${FORCE_REBUILD}"
          RELEASE_TAG_EFFECTIVE="${RELEASE_TAG_INPUT}"
          if [ -n "${MAJOR_FILTER_INPUT}" ] || [ "${TARGET_OS_FILTER_INPUT}" != "any" ] || [ "${TARGET_ARCH_FILTER_INPUT}" != "any" ]; then
            FORCE_REBUILD_EFFECTIVE="true"
          fi

          if [ "${FORCE_REBUILD_EFFECTIVE}" = "true" ]; then
            PLAN_ARGS+=(--force)
          fi
          if [ -n "${RELEASE_TAG_EFFECTIVE}" ]; then
            PLAN_ARGS+=(--release-tag "${RELEASE_TAG_EFFECTIVE}")
          fi

          python scripts/plan_release.py \
            --resolved-file resolved-details.json \
            --state-file release-state/latest.json \
            --inventory-file release-inventory.json \
            --candidate-suffix "${{ github.run_id }}" \
            "${PLAN_ARGS[@]}" > release-plan.json

          cat release-plan.json
          echo "should_build=$(jq -r '.should_build' release-plan.json)" >> "$GITHUB_OUTPUT"
          echo "current_versions_json=$(jq -c '.current_versions' release-plan.json)" >> "$GITHUB_OUTPUT"
          echo "changed_versions_json=$(jq -c '.changed_versions' release-plan.json)" >> "$GITHUB_OUTPUT"
          echo "release_plan_json=$(jq -c . release-plan.json)" >> "$GITHUB_OUTPUT"
          echo "release_tag=$(jq -r '.release_tag' release-plan.json)" >> "$GITHUB_OUTPUT"

      - id: make-matrix
        env:
          MAJOR_FILTER_INPUT: ${{ github.event.inputs.major_filter || '' }}
          TARGET_OS_FILTER_INPUT: ${{ github.event.inputs.target_os_filter || 'any' }}
          TARGET_ARCH_FILTER_INPUT: ${{ github.event.inputs.target_arch_filter || 'any' }}
        shell: python
        run: |
          import json
          import os
          from pathlib import Path

          plan = json.loads(Path("release-plan.json").read_text(encoding="utf-8"))
          resolved = json.loads(Path("resolved-details.json").read_text(encoding="utf-8"))
          versions = plan["changed_versions"]
          major_filter = os.environ.get("MAJOR_FILTER_INPUT", "").strip()
          target_os_filter = os.environ.get("TARGET_OS_FILTER_INPUT", "any").strip().lower() or "any"
          target_arch_filter = os.environ.get("TARGET_ARCH_FILTER_INPUT", "any").strip().lower() or "any"

          valid_os_filters = {"any", "linux", "windows", "macos"}
          valid_arch_filters = {"any", "x86_64", "arm64"}
          if target_os_filter not in valid_os_filters:
              raise SystemExit(f"Invalid target_os_filter: {target_os_filter}")
          if target_arch_filter not in valid_arch_filters:
              raise SystemExit(f"Invalid target_arch_filter: {target_arch_filter}")

          include = [target for target in plan["build_targets"]
                     if (not major_filter or target["major"] == major_filter)
                     and (target_os_filter == "any" or target["target_os"] == target_os_filter)
                     and (target_arch_filter == "any" or target["target_arch"] == target_arch_filter)]

          if versions and not include:
              raise SystemExit(
                  "Selected filters produced an empty build matrix. "
                  "Check major_filter/target_os_filter/target_arch_filter values."
              )

          matrix = {"include": include}
          line = f"matrix={json.dumps(matrix)}"
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write(line + "\n")
              fh.write(f"matrix_has_entries={'true' if include else 'false'}\n")

  validate-scripts:
    needs: check-upstream
    if: needs.check-upstream.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Verify Python scripts compile
        run: python -m compileall scripts

      - name: Re-resolve configured versions
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/resolve_latest_patch.py --majors-file config/majors.json --details > resolved-details.json
          cat resolved-details.json

      - name: Smoke test validation CLIs
        run: |
          python scripts/check_stdlib.py --help
          python scripts/validate_distribution.py --help
          python scripts/plan_release.py --help
          python scripts/update_release_state.py --help

  build:
    needs: [check-upstream, validate-scripts]
    if: needs.check-upstream.outputs.should_build == 'true' && needs.check-upstream.outputs.matrix_has_entries == 'true'
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.check-upstream.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install build dependencies (macOS)
        if: matrix.target_os == 'macos'
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_UPGRADE: "1"
        run: |
          if [[ "${{ matrix.python_version }}" == 3.11.* ]]; then
            formulas=(openssl@3 sqlite xz zlib tcl-tk@8)
          else
            formulas=(openssl@3 sqlite xz zlib tcl-tk)
          fi

          for formula in "${formulas[@]}"; do
            if brew list --versions "$formula" >/dev/null; then
              echo "$formula already installed"
              continue
            fi
            brew install "$formula"
          done

      - name: Build archive
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ matrix.target_os }}" == "linux" ]]; then
            docker run --rm \
              -v "$PWD:/work" \
              quay.io/pypa/manylinux2014_x86_64 \
              bash -c "
                yum install -y \
                  libffi-devel \
                  pkgconfig \
                  sqlite-devel \
                  bzip2-devel \
                  xz-devel \
                  libzstd-devel \
                  readline-devel \
                  ncurses-devel \
                  libuuid-devel \
                  tk-devel \
                  patchelf && \
                cd /work && /opt/python/cp312-cp312/bin/python scripts/build_portable.py \
                  '${{ matrix.major }}' \
                  --python-version '${{ matrix.python_version }}' \
                  --cpython-tag '${{ matrix.cpython_tag }}' \
                  --cpython-tag-commit-sha '${{ matrix.cpython_tag_commit_sha }}' \
                  --target-os '${{ matrix.target_os }}' \
                  --target-arch '${{ matrix.target_arch }}' \
                  --output-dir dist"
          else
            python scripts/build_portable.py \
              "${{ matrix.major }}" \
              --python-version "${{ matrix.python_version }}" \
              --cpython-tag "${{ matrix.cpython_tag }}" \
              --cpython-tag-commit-sha "${{ matrix.cpython_tag_commit_sha }}" \
              --target-os "${{ matrix.target_os }}" \
              --target-arch "${{ matrix.target_arch }}" \
              --output-dir dist
          fi

      - name: Attest archive
        uses: actions/attest@v4
        with:
          subject-path: dist/${{ matrix.archive_name }}

      - id: upload-artifact
        name: Upload artifact
        uses: actions/upload-artifact@v7
        continue-on-error: true
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            dist/${{ matrix.archive_name }}
            dist/${{ matrix.archive_name }}.sha256
          if-no-files-found: error
          overwrite: true

      - name: Retry artifact upload
        if: steps.upload-artifact.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            dist/${{ matrix.archive_name }}
            dist/${{ matrix.archive_name }}.sha256
          if-no-files-found: error
          overwrite: true

  validate-artifacts:
    needs: [check-upstream, build]
    if: needs.check-upstream.outputs.should_build == 'true' && needs.check-upstream.outputs.matrix_has_entries == 'true'
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.check-upstream.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Download built archive
        uses: actions/download-artifact@v8
        with:
          name: ${{ matrix.artifact_name }}
          path: dist-archive

      - name: Diagnose packaged Python startup (Linux)
        if: matrix.target_os == 'linux'
        continue-on-error: true
        shell: bash
        run: |
          TMPDIR_D=$(mktemp -d)
          tar xzf "dist-archive/${{ matrix.archive_name }}" -C "$TMPDIR_D"
          PYTHON_BIN="$TMPDIR_D/python/bin/python3"
          echo "=== ldd python3 ===" | tee -a "$GITHUB_STEP_SUMMARY"
          ldd "$PYTHON_BIN" 2>&1 | tee -a "$GITHUB_STEP_SUMMARY" || true
          echo "=== python3 startup test ===" | tee -a "$GITHUB_STEP_SUMMARY"
          "$PYTHON_BIN" -c "import sys; print(sys.version)" 2>&1 \
            | tee -a "$GITHUB_STEP_SUMMARY" || true
          rm -rf "$TMPDIR_D"

      - name: Validate packaged distribution
        shell: bash
        run: |
          set -euo pipefail
          python scripts/validate_distribution.py \
            "dist-archive/${{ matrix.archive_name }}" \
            --full-timeout-seconds 20 \
            2>&1 | tee -a "$GITHUB_STEP_SUMMARY"

  release:
    if: needs.check-upstream.outputs.should_build == 'true' && needs.check-upstream.outputs.matrix_has_entries == 'true'
    needs: [check-upstream, validate-artifacts]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Restore release plan
        run: |
          printf '%s' '${{ needs.check-upstream.outputs.release_plan_json }}' > release-plan.json
          cat release-plan.json

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: release-assets
          merge-multiple: true

      - name: Carry forward verified unchanged release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/carry_forward_release_assets.py --plan-file release-plan.json --dest-dir release-assets --download

      - name: Verify complete release inventory and checksums
        run: python scripts/release_inventory.py verify --plan-file release-plan.json --directory release-assets

      - name: Protect published and signed releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/release_inventory.py guard-target --plan-file release-plan.json

      - name: Update release state files
        env:
          GITHUB_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python scripts/update_release_state.py \
            --plan-file release-plan.json \
            --output-dir release-state \
            --build-source-commit "${{ github.sha }}" \
            --workflow-run-id "${{ github.run_id }}" \
            --workflow-run-url "${GITHUB_RUN_URL}" \
            --repository "${{ github.repository }}" \
            --event-name "${{ github.event_name }}"

      - id: commit-state
        name: Commit release state
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add release-state

          if git diff --cached --quiet; then
            echo "release_commit_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git commit -m "Record release state for ${{ needs.check-upstream.outputs.release_tag }}"
          git push origin HEAD:${{ github.ref_name }}
          echo "release_commit_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - id: push-tag
        name: Create and push release tag
        env:
          RELEASE_TAG: ${{ needs.check-upstream.outputs.release_tag }}
          RELEASE_COMMIT_SHA: ${{ steps.commit-state.outputs.release_commit_sha }}
        run: |
          set -euo pipefail

          git fetch --tags --force --prune --prune-tags
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git ls-remote --exit-code --tags origin "refs/tags/${RELEASE_TAG}" >/dev/null 2>&1; then
            echo "Tag already exists on origin: ${RELEASE_TAG}"
            echo "tag_name=${RELEASE_TAG}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if git rev-parse -q --verify "refs/tags/${RELEASE_TAG}" >/dev/null; then
            git tag -d "${RELEASE_TAG}"
          fi

          git tag -a "${RELEASE_TAG}" "${RELEASE_COMMIT_SHA}" -m "Release ${RELEASE_TAG}"
          git push origin "refs/tags/${RELEASE_TAG}"
          echo "tag_name=${RELEASE_TAG}" >> "$GITHUB_OUTPUT"

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          draft: true
          make_latest: false
          tag_name: ${{ steps.push-tag.outputs.tag_name }}
          name: "Portable Python ${{ needs.check-upstream.outputs.release_tag }}"
          fail_on_unmatched_files: true
          generate_release_notes: true
          files: release-assets/*

  attest-signed-release:
    if: github.event_name == 'workflow_dispatch' && inputs.signed_release_id != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Download selected draft assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ inputs.signed_release_id }}
        run: python scripts/release_asset_download.py metadata
      - name: Authenticate local signing manifest
        id: authenticated
        env:
          RELEASE_ID: ${{ inputs.signed_release_id }}
          SIGNING_SESSION: ${{ inputs.signing_session }}
          MANIFEST_SHA256: ${{ inputs.signing_manifest_sha256 }}
        shell: python
        run: |
          import base64, hashlib, json, os, pathlib, re, subprocess
          root = pathlib.Path("signed-release")
          manifest = root / "release-signing.json"
          signature = json.loads((root / "release-signing.sig.json").read_text())
          assert hashlib.sha256(manifest.read_bytes()).hexdigest() == os.environ["MANIFEST_SHA256"]
          key = pathlib.Path("scripts/release-signing-public.pem")
          der = subprocess.check_output(["openssl", "pkey", "-pubin", "-in", str(key), "-outform", "DER"])
          expected = "37308863a4298862c06004abc7ecf968cc6cba5a55ef36abea57a785864f1dee"
          assert hashlib.sha256(der).hexdigest() == expected == signature["spki_sha256"]
          assert signature["algorithm"] == "RSASSA_PKCS1_V1_5_SHA_256"
          assert base64.b64decode(signature["digest_base64"], validate=True) == hashlib.sha256(manifest.read_bytes()).digest()
          detached = pathlib.Path("manifest-signature.bin")
          detached.write_bytes(base64.b64decode(signature["signature_base64"], validate=True))
          subprocess.run(["openssl", "dgst", "-sha256", "-verify", str(key), "-signature", str(detached), str(manifest)], check=True)
          data = json.loads(manifest.read_text())
          assert data["repository"] == os.environ["GITHUB_REPOSITORY"]
          assert data["release_id"] == int(os.environ["RELEASE_ID"])
          assert data["session"] == os.environ["SIGNING_SESSION"]
          assert re.fullmatch(r"[0-9a-f]{40}", data["signer_revision"])
          with open(os.environ["GITHUB_OUTPUT"], "a") as stream:
              stream.write("revision=" + data["signer_revision"] + "\n")
      - name: Download only manifest-authorized final files
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ inputs.signed_release_id }}
        run: python scripts/release_asset_download.py files
      - name: Verify every final release file
        env:
          RELEASE_ID: ${{ inputs.signed_release_id }}
          SIGNING_SESSION: ${{ inputs.signing_session }}
        shell: python
        run: |
          import pathlib, json, os, re, hashlib
          Path = pathlib.Path
          Refused = RuntimeError
          REPOSITORIES = {'llama': 'fael-ai-org/llama-cpp-py-sync', 'python': 'fael-ai-org/python-builds'}
          def safe_name(value: str) -> str:
              if (not isinstance(value, str) or not re.fullmatch(r"[A-Za-z0-9][A-Za-z0-9._+-]{0,219}", value)
                      or value in {".", ".."} or value.endswith(".")):
                  raise Refused("Invalid release asset name")
              return value

          def digest(path: Path) -> str:
              result = hashlib.sha256()
              with path.open("rb") as stream:
                  for chunk in iter(lambda: stream.read(1024 * 1024), b""):
                      result.update(chunk)
              return result.hexdigest()

          def verify_files(root: Path, manifest: dict, repository: str, release_id: int, session: str):
              if (repository not in REPOSITORIES.values() or manifest.get("repository") != repository
                      or manifest.get("release_id") != release_id or manifest.get("session") != session
                      or not re.fullmatch(r"[0-9a-f]{40}", manifest.get("signer_revision", ""))):
                  raise Refused("Release manifest is for a different release or coordinator revision")
              expected = {safe_name(item["name"]): item for item in manifest["files"]}
              if len(expected) != len(manifest["files"]):
                  raise Refused("Release manifest contains duplicate output names")
              actual = {path.name for path in root.iterdir() if path.is_file()}
              if actual != set(expected) | {"release-signing.json", "release-signing.sig.json"}:
                  raise Refused("Release contains unlisted, missing or partially replaced files")
              for name, item in expected.items():
                  path = root / name
                  if path.is_symlink() or digest(path) != item["sha256"] or path.stat().st_size != item["size"]:
                      raise Refused("Final release file differs from its signed manifest")
              return expected

          verify_files(pathlib.Path('signed-release'), json.loads(pathlib.Path('signed-release/release-signing.json').read_text()), os.environ['GITHUB_REPOSITORY'], int(os.environ['RELEASE_ID']), os.environ['SIGNING_SESSION'])

      - name: Attest locally signed release files
        uses: actions/attest@v4
        with:
          subject-path: signed-release/*
