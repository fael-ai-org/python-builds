name: Check for New Python Versions

on:
  schedule:
    - cron: "0 4 * * 1"  # Every Monday at 4:00 AM UTC
  workflow_dispatch:
    inputs:
      force_build:
        description: "Rebuild every configured major even if patches are unchanged."
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

permissions:
  actions: write
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Resolve latest Python patch versions
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/resolve_latest_patch.py \
            --majors-file config/majors.json \
            --details > resolved-details.json
          cat resolved-details.json

      - name: Plan incremental release
        id: check
        env:
          FORCE_BUILD: ${{ github.event.inputs.force_build || 'false' }}
        run: |
          set -euo pipefail

          PLAN_ARGS=()
          if [ "${FORCE_BUILD}" = "true" ]; then
            PLAN_ARGS+=(--force)
          fi

          python scripts/plan_release.py \
            --resolved-file resolved-details.json \
            --state-file release-state/latest.json \
            "${PLAN_ARGS[@]}" > release-plan.json
          cat release-plan.json

          SHOULD_BUILD="$(jq -r '.should_build' release-plan.json)"
          RELEASE_TAG="$(jq -r '.release_tag' release-plan.json)"
          CHANGED="$(jq -r '.changed_majors | join(",")' release-plan.json)"
          echo "should_build=${SHOULD_BUILD}" >> "$GITHUB_OUTPUT"
          echo "release_tag=${RELEASE_TAG}" >> "$GITHUB_OUTPUT"
          echo "Planned majors: ${CHANGED:-none}"

      - name: Trigger build workflow
        if: steps.check.outputs.should_build == 'true'
        env:
          FORCE_BUILD: ${{ github.event.inputs.force_build || 'false' }}
        run: |
          set -euo pipefail

          FORCE_REBUILD="false"
          if [ "${FORCE_BUILD}" = "true" ]; then
            FORCE_REBUILD="true"
          fi

          PAYLOAD="$(jq -cn \
            --arg ref "${{ github.ref_name }}" \
            --arg force "${FORCE_REBUILD}" \
            '{ref:$ref, inputs:{force_rebuild:$force}}')"

          HTTP_STATUS="$(curl -sS -L \
            -X POST \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            -o /dev/null \
            -w "%{http_code}" \
            "${{ github.api_url }}/repos/${{ github.repository }}/actions/workflows/build-python.yml/dispatches" \
            -d "${PAYLOAD}")"

          if [ "${HTTP_STATUS}" != "204" ]; then
            echo "Build workflow dispatch failed with HTTP ${HTTP_STATUS}." >&2
            exit 1
          fi

          echo "Build workflow dispatched (force_rebuild=${FORCE_REBUILD})."
